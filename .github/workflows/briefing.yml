name: 브리핑 자동 갱신

# 스케줄은 UTC 기준. KST = UTC+9.
#  - 06:00 KST (월~금)  = 21:00 UTC (일~목)      → '0 21 * * 0-4'
#  - 14:00 KST (월~목)  = 05:00 UTC (월~목)      → '0 5  * * 1-4'
#  - 13:00 KST (금)     = 04:00 UTC (금)         → '0 4  * * 5'
# GitHub Actions cron은 부하에 따라 몇 분 지연될 수 있습니다(정상).
on:
  schedule:
    - cron: '0 21 * * 0-4'   # 평일 오전 06:00 KST
    - cron: '0 5 * * 1-4'    # 월~목 오후 14:00 KST
    - cron: '0 4 * * 5'      # 금요일 오후 13:00 KST
  workflow_dispatch:          # 수동 실행 버튼

# Actions가 저장소에 커밋/푸시할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 브리핑 생성
        run: python scripts/build.py

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name  "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "브리핑 자동 갱신: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi
